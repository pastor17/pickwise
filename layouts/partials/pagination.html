{{- /* Pagination. Input: a Hugo paginator. */ -}}
{{- if gt .TotalPages 1 -}}
<nav class="pagination" aria-label="Pagination">
  {{- if .HasPrev -}}
    <a class="pagination__link" href="{{ .Prev.URL }}">← Newer</a>
  {{- else -}}
    <span class="pagination__link is-disabled">← Newer</span>
  {{- end -}}
  <span class="pagination__info">Page {{ .PageNumber }} of {{ .TotalPages }}</span>
  {{- if .HasNext -}}
    <a class="pagination__link" href="{{ .Next.URL }}">Older →</a>
  {{- else -}}
    <span class="pagination__link is-disabled">Older →</span>
  {{- end -}}
</nav>
{{- end -}}
